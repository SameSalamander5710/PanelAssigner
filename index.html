<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PanelAssigner</title>
  <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
  <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
  <style>
    :root { --box-height: 43rem; }
    body { font-family: system-ui, sans-serif; max-width: 56.2rem; margin: 2rem auto; padding: 0 1rem; }
    textarea, #output { width: 100%; box-sizing: border-box; font-family: ui-monospace, monospace; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    button { padding: .5rem 1.25rem; font-size: 1rem; }
    #topn { width: 4rem; }
    .layout {
      display: grid;
      grid-template-columns: 35fr 10rem 50fr;
      grid-template-areas:
        "inlabel  .        outlabel"
        "inbox    controls outbox";
      gap: 1rem;
      align-items: start;
    }
    .input-label { grid-area: inlabel; }
    .output-label { grid-area: outlabel; margin-top: 1rem; font-weight: 600; }
    #input { grid-area: inbox; height: var(--box-height); resize: vertical; }
    .output-panel { grid-area: outbox; display: flex; flex-direction: column; }
    #output {
      height: var(--box-height);
      margin: 0;
      overflow: auto;
      padding: 0;
      border: 1px solid #767676;
      background: #fff;
    }
    .results-table {
      border-collapse: collapse;
      width: 100%;
      font-size: 13.3333px;
    }
    .results-table th,
    .results-table td {
      border: 1px solid #d0d0d0;
      padding: 2px 6px;
      text-align: left;
      white-space: nowrap;
    }
    .results-table thead th {
      position: sticky;
      top: 0;
      background: #f2f2f2;
      z-index: 1;
    }
    .results-table .num { text-align: right; }
    .results-table .ci-row th,
    .results-table .ci-row td { background: #f2f2f2; font-weight: 600; }
    .results-table .assigned,
    .legend .assigned { background: #d9f2d9; }
    .results-table .unmapped,
    .legend .unmapped { background: #fff3bf; }
    .results-table .unassigned,
    .legend .unassigned { background: #ffd6d6; }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: .35rem 1rem;
      margin-top: .5rem;
      font-size: .85rem;
    }
    .legend .item { display: inline-flex; align-items: center; gap: .35rem; }
    .legend .swatch {
      display: inline-block;
      width: 1rem;
      height: 1rem;
      border: 1px solid #999;
    }
    .controls {
      grid-area: controls;
      height: var(--box-height);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .75rem;
    }
    .controls button { width: 100%; }
    .topn-line { white-space: nowrap; }
    #status { margin: 0; font-size: .85rem; text-align: center; }
    @media (max-width: 800px) {
      .layout {
        grid-template-columns: 1fr;
        grid-template-areas: "inlabel" "inbox" "controls" "outlabel" "outbox";
      }
      #input, #output, .controls { height: auto; }
      #input, #output { min-height: 16rem; }
    }
  </style>
</head>
<body>
  <h1>PanelAssigner</h1>
  <div class="layout">
    <label for="input" class="input-label">Paste Antibody / Fluorophore pairs (two columns, e.g. straight from Excel)</label>
    <textarea id="input" rows="12" placeholder="Antibody&#9;Fluorophore&#10;CD3&#9;BV421&#10;CD3&#9;FITC"></textarea>
    <div class="controls">
      <button id="run" disabled>Compute</button>
      <div class="topn-line">Top <input id="topn" type="number" value="3" min="1"> panels</div>
      <p id="status">Loading 4 Python workers (first visit takes a while)...</p>
    </div>
    <div class="output-label">Results</div>
    <div class="output-panel">
      <div id="output"></div>
      <div class="legend">
        <span class="item"><span class="swatch assigned"></span>Assigned</span>
        <span class="item"><span class="swatch unmapped"></span>Unmapped</span>
        <span class="item"><span class="swatch unassigned"></span>Unassigned</span>
      </div>
    </div>
  </div>

  <!-- Main thread: tiny MicroPython, only handles the UI -->
  <script type="mpy" src="./main.py"></script>
  <!-- Heavy compute: 4 identical Pyodide workers (one per CPU thread). To use
       a different number, add/remove a line here AND edit NAMES in main.py. -->
  <script type="py" src="./worker.py" config="./pyscript.toml" worker name="w0"></script>
  <script type="py" src="./worker.py" config="./pyscript.toml" worker name="w1"></script>
  <script type="py" src="./worker.py" config="./pyscript.toml" worker name="w2"></script>
  <script type="py" src="./worker.py" config="./pyscript.toml" worker name="w3"></script>
</body>
</html>
